on:
  push:
    branches:
    - main
    paths:
    - clusterkubevirtadm/**
  pull_request:
    paths:
    - clusterkubevirtadm/**
name: test-clusterkubevirtadm
jobs:
  clusterkubevirtadm-unit_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
    - name: Install Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: '1.26.10'
    - name: Test
      run: make clusterkubevirtadm-test
    - name: Build for linux
      run: make clusterkubevirtadm-linux
    - name: Build for macos
      run: make clusterkubevirtadm-macos
    - name: Build for windows
      run: make clusterkubevirtadm-win
