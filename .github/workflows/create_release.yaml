on:
  push:
    tags:
      - "v*"

name: Upload Release Asset

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2
      - name: build image
        shell: bash
        env:
          QUAY_TOKEN: ${{secrets.QUAY_TOKEN}}
          REGISTRY: "quay.io/capk"
          TAG: ${{ github.ref_name }}
        run: |
          echo $QUAY_TOKEN | docker login -u="capk+capk_robot" quay.io --password-stdin
          make docker-build-all
          make docker-push-all
  build:
    name: Upload Release Asset
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install kustomize
        run: curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
      - name: Create infrastructure components
        env:
          REGISTRY: "quay.io/capk"
          IMAGE_NAME: "capk-manager"
          TAG: ${{ github.ref_name }}
        run: |
          make create-infrastructure-components
      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: | 
            infrastructure-components.yaml
            metadata.yaml
            templates/*.yaml
